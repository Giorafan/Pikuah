<title>פיקוח עליון בשטח</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: a one-column field sheet. Big touch targets, hairline rules and small-caps labels borrowed from a plan-sheet title block. */
:root {
  --bg: #EBEFEA;
  --surface: #FFFFFF;
  --surface-2: #F3F6F2;
  --ink: #17211C;
  --muted: #5B6A62;
  --line: #CBD4CD;
  --accent: #2C6A4F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBE2;
  --urgent: #B3321F;
  --urgent-bg: #FBE5E0;
  --normal: #8F5806;
  --normal-bg: #FAEDD0;
  --improve: #1F5FA6;
  --improve-bg: #E1ECF8;
  --danger: #B3321F;
  --shadow: 0 1px 2px rgba(23, 33, 28, .07), 0 6px 18px rgba(23, 33, 28, .06);
  --f-display: 'Heebo', 'Arial Hebrew', Arial, sans-serif;
  --f-body: 'Heebo', 'Arial Hebrew', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --surface: #18211C; --surface-2: #1F2A24; --ink: #E9EFEA; --muted: #98A89F; --line: #2E3B34;
    --accent: #6FC29A; --accent-ink: #0B1A12; --accent-soft: #22362B;
    --urgent: #F08A78; --urgent-bg: #3A1F1A; --normal: #E6B25A; --normal-bg: #38290F; --improve: #7DB2EE; --improve-bg: #1A2B40; --danger: #F08A78;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101612; --surface: #18211C; --surface-2: #1F2A24; --ink: #E9EFEA; --muted: #98A89F; --line: #2E3B34;
  --accent: #6FC29A; --accent-ink: #0B1A12; --accent-soft: #22362B;
  --urgent: #F08A78; --urgent-bg: #3A1F1A; --normal: #E6B25A; --normal-bg: #38290F; --improve: #7DB2EE; --improve-bg: #1A2B40; --danger: #F08A78;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 0; padding-bottom: 0;
  direction: rtl; text-align: right;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface);
}
#app { max-width: 640px; margin: 0 auto; padding-bottom: 96px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.ic { flex: none; display: block; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; min-height: 56px;
}
.top h1 { margin: 0; font-family: var(--f-body); font-weight: 700; font-size: 22px; line-height: 1.2; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sub { font-size: 12px; color: var(--muted); font-family: var(--f-body); font-weight: 400; display: block; }
.saved { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid transparent; background: transparent;
  display: grid; place-items: center; color: var(--ink); flex: none;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn.bordered { border-color: var(--line); background: var(--surface); }

/* layout bits */
.stack { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.card > h2, .sec { margin: 0 0 12px; font-size: 12px; letter-spacing: .04em; font-weight: 700; color: var(--muted); }
.sec { margin: 8px 0 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld + .fld { margin-top: 12px; }
.grid2 .fld + .fld { margin-top: 0; }
.fld label, .lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type=text], input[type=date], input[type=time], input[type=tel], input[type=search], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface-2); color: var(--ink); font-size: 16px; line-height: 1.4; min-width: 0;
}
textarea { resize: none; min-height: 96px; overflow: hidden; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); background: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: 16px; text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.big { min-height: 58px; font-size: 18px; width: 100%; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .btn { flex: 1; }

/* pills & segments */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 22px; white-space: nowrap; }
.pill.urgent { background: var(--urgent-bg); color: var(--urgent); }
.pill.normal { background: var(--normal-bg); color: var(--normal); }
.pill.improve { background: var(--improve-bg); color: var(--improve); }
.pill.open { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); line-height: 20px; }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 500; font-size: 15px; }
.seg button[aria-pressed=true] { font-weight: 700; border-color: currentColor; }
.seg button[aria-pressed=true][data-v=urgent] { background: var(--urgent-bg); color: var(--urgent); }
.seg button[aria-pressed=true][data-v=normal] { background: var(--normal-bg); color: var(--normal); }
.seg button[aria-pressed=true][data-v=improve] { background: var(--improve-bg); color: var(--improve); }
.seg button[aria-pressed=true][data-v=open] { background: var(--surface); color: var(--ink); border-color: var(--ink); }

<script>
/* Export library: builds a Hebrew RTL .docx and an image-page .pdf with no external dependencies. */
const SupLib = (function () {
  'use strict';
  const enc = new TextEncoder();

  /* ---------- ZIP (store only) ---------- */
  const CRC_T = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(b) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files, mime) {
    const parts = [], central = [];
    let off = 0;
    const now = new Date();
    const dt = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const tm = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    for (const f of files) {
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    }
    let cs = 0;
    for (const p of central) cs += p.length;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cs, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: mime });
  }

  /* ---------- WordprocessingML helpers ---------- */
  const esc = s => String(s == null ? '' : s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const FONT = 'Arial';
  const CM = 360000; // EMU per cm

  function rpr(o) {
    o = o || {};
    const sz = o.sz || 24;
    return '<w:rPr><w:rFonts w:ascii="' + FONT + '" w:hAnsi="' + FONT + '" w:cs="' + FONT + '"/>' +
      (o.b ? '<w:b/><w:bCs/>' : '') + (o.c ? '<w:color w:val="' + o.c + '"/>' : '') +
      '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/>' +
      (o.u ? '<w:u w:val="single"/>' : '') + '<w:rtl/></w:rPr>';
  }
  function runs(text, o) {
    const lines = String(text == null ? '' : text).split(/\r?\n/);

      '<w:r>' + rpr(o) + (i ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + esc(ln) + '</w:t></w:r>').join('');
  }
  function para(content, o) {
    o = o || {};
    let ppr = '';
    if (o.style) ppr += '<w:pStyle w:val="' + o.style + '"/>';
    if (o.keepNext) ppr += '<w:keepNext/>';
    if (o.numId) ppr += '<w:numPr><w:ilvl w:val="0"/><w:numId w:val="' + o.numId + '"/></w:numPr>';
    if (o.pbdr) ppr += o.pbdr;
    ppr += '<w:bidi/>';
    ppr += '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0) + '" w:line="' + (o.line || 360) + '" w:lineRule="auto"/>';
    if (o.ind) ppr += o.ind;
    if (o.jc) ppr += '<w:jc w:val="' + o.jc + '"/>';
    return '<w:p><w:pPr>' + ppr + '</w:pPr>' + content + '</w:p>';
  }
  function tcell(w, paras, extra) {
    return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' + (extra || '') + '</w:tcPr>' + paras + '</w:tc>';
  }
  function table(cols, rows) {
    return '<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="' + cols.reduce((a, b) => a + b, 0) + '" w:type="dxa"/>' +
      '<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>' +
      '<w:bottom w:w="0" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
      '<w:tblGrid>' + cols.map(w => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>' + rows.join('') + '</w:tbl>';
  }
  const trow = cells => '<w:tr><w:trPr><w:cantSplit/></w:trPr>' + cells.join('') + '</w:tr>';
  function fitEmu(w, h, maxW, maxH) {
    const k = Math.min(maxW / w, maxH / h);
    return { cx: Math.max(1, Math.round(w * k)), cy: Math.max(1, Math.round(h * k)) };
  }

  /* ---------- DOCX: a Hebrew supervision letter on office letterhead ---------- */
  function buildDocx(m) {
    const media = [];
    const rels = { doc: [], hdr: [], ftr: [] };
    let drawId = 0;
    const drawing = (img, maxW, maxH, part, border) => {
      const n = media.length + 1, ext = img.ext || 'jpg', name = 'image' + n + '.' + ext, rid = 'rIdImg' + n;
      media.push({ name, data: img.bytes });
      rels[part || 'doc'].push({ rid, name });
      const s = fitEmu(img.w, img.h, maxW, maxH), id = ++drawId;
      return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="' + s.cx + '" cy="' + s.cy + '"/>' +
        '<wp:docPr id="' + id + '" name="Picture ' + id + '"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
        '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>' +
        '<pic:nvPicPr><pic:cNvPr id="' + id + '" name="' + name + '"/><pic:cNvPicPr/></pic:nvPicPr>' +
        '<pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
        '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + s.cx + '" cy="' + s.cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>' + (border ? '<a:ln w="9525"><a:solidFill><a:srgbClr val="D5DBC6"/></a:solidFill></a:ln>' : '') + '</pic:spPr>' +
        '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
    };
    const P = (t, po, ro) => para(runs(t, ro), po);
    const blank = () => para('', {});
    const body = [];

    const GREEN = '788850', TINT = 'EEF1E6', LINEC = 'D5DBC6', MUTED = '66756B';
    const noB = '<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders>';
    const bd = c => '<w:tcBorders>' + ['top', 'left', 'bottom', 'right'].map(k => '<w:' + k + ' w:val="single" w:sz="6" w:space="0" w:color="' + c + '"/>').join('') + '</w:tcBorders>';
    const section = t => P(t, { keepNext: true, before: 200, after: 120, pbdr: '<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="' + LINEC + '"/></w:pBdr>' }, { b: true, sz: 30, c: GREEN });

    body.push(P(m.letterDate, { jc: 'right' }));
    if (m.projNo) body.push(P(m.projNo, { jc: 'right' }, { b: true, c: GREEN }));
    body.push(blank());
    /* subject block: tinted, with a green bar on the right */
    body.push(table([9638], [trow([tcell(9638,
      P('דו"ח פיקוח עליון', { before: 120 }, { b: true, c: GREEN }) + P(m.subject || 'ללא נושא', { after: 120 }, { b: true, sz: 36 }),
      '<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="single" w:sz="36" w:space="0" w:color="' + GREEN + '"/></w:tcBorders><w:shd w:val="clear" w:color="auto" w:fill="' + TINT + '"/>')])]));
    body.push(blank());
    /* three info cards */
    const card = (label, val) => tcell(3100, P(label, { before: 60 }, { b: true, c: MUTED }) + P(val || '—', { after: 60 }, { b: true }), bd(LINEC));
    const gap = () => tcell(169, para('', {}), noB);
    body.push(table([3100, 169, 3100, 169, 3100], [trow([card('תאריך ביקור', m.visitDate), gap(), card('מיקום', m.location), gap(), card('רושם', m.signName)])]));
    if (m.participants && m.participants.length) {
      body.push(section('משתתפים'));
      m.participants.forEach(l => body.push(P(l)));
    }
    if ((m.items || []).length) body.push(section('הערות והוראות'));

    const indent = '<w:ind w:left="720"/>';
    (m.items || []).forEach(it => {
      const ph = it.photos || [];
      const hasDocs = (it.docs || []).length > 0, tail = ph.length > 0 || hasDocs;
      if (it.title) {
        body.push(para(runs(it.title, { b: true }), { style: 'ListParagraph', numId: 1, keepNext: true, after: 40 }));
        if (it.text) body.push(para(runs(it.text, {}), { ind: indent, keepNext: tail, after: tail ? 60 : 0 }));
      } else {
        body.push(para(runs(it.text || '', {}), { style: 'ListParagraph', numId: 1, keepNext: tail, after: tail ? 60 : 0 }));
      }
      if (ph.length === 1) {
        body.push(para(drawing(ph[0], 15.4 * CM, 13 * CM, undefined, true), { ind: indent, line: 240, after: 160 }));
      } else {
        for (let i = 0; i < ph.length; i += 2) {
          const row = [ph[i], ph[i + 1]].filter(Boolean);
          const sp = '<w:r>' + rpr({}) + '<w:t xml:space="preserve">   </w:t></w:r>';
          body.push(para(row.map(p => drawing(p, 7.5 * CM, 9 * CM, undefined, true)).join(sp), { ind: indent, line: 240, after: 160 }));
        }
      }
      if ((it.docs || []).length) body.push(para(runs('מסמכים מצורפים: ' + it.docs.join(', '), { c: '66756B' }), { ind: indent, after: 160 }));
    });
    body.push(blank());

    /* closing: cc list (right) and signature (left) */
    const cc = [P('העתק:', {}, { b: true, c: GREEN })];
    (m.cc || []).forEach(l => cc.push(P(l, {})));
    const sig = [P('רשם: ' + (m.signName || ''), { jc: 'right' }, { b: true, sz: 24 })];
    if (m.signTitle) sig.push(P(m.signTitle, { jc: 'right' }, { sz: 24 }));
    if (m.signature) sig.push(para(drawing(m.signature, 3.3 * CM, 2.2 * CM), { jc: 'right', line: 240 }));
    body.push(table([4819, 4819], [trow([tcell(4819, cc.join('')), tcell(4819, sig.join(''))])]));
    body.push(blank());

    const hdr = m.header ? para(drawing(m.header, 20.6 * CM, 4 * CM, 'hdr'), { jc: 'center', line: 240, ind: '<w:ind w:left="-1037" w:right="-1037"/>' }) : para('', {});
    const ftr = m.footer ? para(drawing(m.footer, 19.8 * CM, 4 * CM, 'ftr'), { jc: 'center', line: 240, ind: '<w:ind w:left="-794" w:right="-794"/>' }) : para('', {});

    const sect = '<w:sectPr><w:headerReference w:type="default" r:id="rIdHdr1"/><w:footerReference w:type="default" r:id="rIdFtr1"/>' +
      '<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="' + (m.header ? 1900 : 1440) + '" w:right="1134" w:bottom="' + (m.footer ? 1900 : 1440) + '" w:left="1134" w:header="0" w:footer="284" w:gutter="0"/>' +
      '<w:cols w:space="708"/><w:bidi/></w:sectPr>';

    const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const NS = 'xmlns:w="' + W + '" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
    const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    const documentXml = XML + '<w:document ' + NS + '><w:body>' + body.join('') + sect + '</w:body></w:document>';
    const headerXml = XML + '<w:hdr ' + NS + '>' + hdr + '</w:hdr>';
    const footerXml = XML + '<w:ftr ' + NS + '>' + ftr + '</w:ftr>';

    const stylesXml = XML + '<w:styles xmlns:w="' + W + '">' +
      '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:eastAsia="Arial" w:cs="Arial"/><w:sz w:val="24"/><w:szCs w:val="24"/>' +
      '<w:lang w:val="he-IL" w:eastAsia="he-IL" w:bidi="he-IL"/></w:rPr></w:rPrDefault>' +
      '<w:pPrDefault><w:pPr><w:bidi/></w:pPr></w:pPrDefault></w:docDefaults>' +
      '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
      '<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:uiPriority w:val="34"/><w:qFormat/>' +
      '<w:pPr><w:ind w:left="720"/></w:pPr></w:style></w:styles>';
    const numberingXml = XML + '<w:numbering xmlns:w="' + W + '"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="singleLevel"/>' +
      '<w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/>' +
      '<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr><w:rPr><w:b/><w:bCs/><w:color w:val="788850"/></w:rPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';

    const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const relsXml = list => XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + list + '</Relationships>';
    const imgRels = arr => arr.map(x => '<Relationship Id="' + x.rid + '" Type="' + REL + '/image" Target="media/' + x.name + '"/>').join('');
    const docRels = relsXml(
      '<Relationship Id="rIdSty" Type="' + REL + '/styles" Target="styles.xml"/>' +
      '<Relationship Id="rIdNum" Type="' + REL + '/numbering" Target="numbering.xml"/>' +
      '<Relationship Id="rIdHdr1" Type="' + REL + '/header" Target="header1.xml"/>' +
      '<Relationship Id="rIdFtr1" Type="' + REL + '/footer" Target="footer1.xml"/>' + imgRels(rels.doc));

    const exts = {};
    media.forEach(x => { exts[x.name.split('.').pop()] = true; });
    const MT = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png' };
    const O = 'application/vnd.openxmlformats-officedocument.wordprocessingml.';
    const contentTypes = XML + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      Object.keys(exts).map(e => '<Default Extension="' + e + '" ContentType="' + (MT[e] || 'application/octet-stream') + '"/>').join('') +
      '<Override PartName="/word/document.xml" ContentType="' + O + 'document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="' + O + 'styles+xml"/>' +
      '<Override PartName="/word/numbering.xml" ContentType="' + O + 'numbering+xml"/>' +
      '<Override PartName="/word/header1.xml" ContentType="' + O + 'header+xml"/>' +
      '<Override PartName="/word/footer1.xml" ContentType="' + O + 'footer+xml"/></Types>';
    const rootRels = relsXml('<Relationship Id="rId1" Type="' + REL + '/officeDocument" Target="word/document.xml"/>');

    const files = [
      { name: '[Content_Types].xml', data: enc.encode(contentTypes) },
      { name: '_rels/.rels', data: enc.encode(rootRels) },
      { name: 'word/document.xml', data: enc.encode(documentXml) },
      { name: 'word/_rels/document.xml.rels', data: enc.encode(docRels) },
      { name: 'word/styles.xml', data: enc.encode(stylesXml) },
      { name: 'word/numbering.xml', data: enc.encode(numberingXml) },
      { name: 'word/header1.xml', data: enc.encode(headerXml) },
      { name: 'word/_rels/header1.xml.rels', data: enc.encode(relsXml(imgRels(rels.hdr))) },
      { name: 'word/footer1.xml', data: enc.encode(footerXml) },
      { name: 'word/_rels/footer1.xml.rels', data: enc.encode(relsXml(imgRels(rels.ftr))) }
    ].concat(media.map(x => ({ name: 'word/media/' + x.name, data: x.data })));
    return zip(files, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }

  /* ---------- PDF (one JPEG per A4 page) ---------- */
  function buildPdf(pages, title) {
    const W = 595.28, H = 841.89;
    const chunks = [], offs = [];
    let pos = 0;
    const latin = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
    const push = x => { const b = typeof x === 'string' ? latin(x) : x; chunks.push(b); pos += b.length; };
    const begin = n => { offs[n] = pos; push(n + ' 0 obj\n'); };
    const n = pages.length;
    const hex16 = s => 'FEFF' + Array.from(String(s || '')).map(c => c.charCodeAt(0).toString(16).padStart(4, '0')).join('').toUpperCase();
    const infoNum = 3 + 3 * n;

    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    begin(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    begin(2);
    push('<< /Type /Pages /Count ' + n + ' /Kids [' + pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] >>\nendobj\n');
    pages.forEach((pg, i) => {
      const po = 3 + 3 * i, co = po + 1, io = po + 2;
      begin(po);
      push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 ' + io + ' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ' + co + ' 0 R >>\nendobj\n');
      const content = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q\n';
      begin(co);
      push('<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\nendobj\n');
      begin(io);
      push('<< /Type /XObject /Subtype /Image /Width ' + pg.w + ' /Height ' + pg.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + pg.bytes.length + ' >>\nstream\n');
      push(pg.bytes);
      push('\nendstream\nendobj\n');
    });
    begin(infoNum);
    push('<< /Title <' + hex16(title) + '> /Producer (Supervision Report App) >>\nendobj\n');
    const xref = pos, total = infoNum + 1;
    let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R /Info ' + infoNum + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF');
    return new Blob(chunks, { type: 'application/pdf' });
  }

  return { buildDocx, buildPdf, crc32 };
})();
if (typeof module !== 'undefined') module.exports = SupLib;

  const DB = (function () {

      async get(id) { if (!db) return structuredClone(memR.get(id)); try { return await wrap(st('reports', 'readonly').get(id)); } catch (e) { return null; } },

  }
  function recSet(v) {
    const ta = $('[data-bind="f:text"]'), f = curFinding(); if (!ta || !f) return;
    ta.value = v; autosize(ta); f.text = v; touch();
  }
  /* Rebuilds the whole session transcript from every result on each event, so it is safe even when
     the engine repeats earlier results (Android) or reports resultIndex wrongly. Cumulative results
     ("שלום", "שלום עולם") replace each other instead of being appended. */
  function recJoin(results) {
    const parts = []; let interim = [];
    for (let i = 0; i < results.length; i++) {
      const t = String(results[i][0].transcript || '').trim(); if (!t) continue;
      if (results[i].isFinal) {
        const last = parts[parts.length - 1];
        if (last && (t === last || last.startsWith(t))) continue;
        if (last && t.startsWith(last)) parts[parts.length - 1] = t; else parts.push(t);
      } else interim.push(t);
    }
    let tail = interim.join(' ').trim();
    const last = parts[parts.length - 1];
    if (last && tail) { if (tail === last || last.startsWith(tail)) tail = ''; else if (tail.startsWith(last)) tail = tail.slice(last.length).trim(); }
    return parts.concat(tail ? [tail] : []).join(' ');
  }
  function recStop() { REC.on = false; clearTimeout(REC.timer); if (REC.r) { try { REC.r.stop(); } catch (e) { /* ignore */ } } recUI(); recStatus(''); }
  function recFail(msg) { REC.on = false; clearTimeout(REC.timer); recUI(); recStatus(msg); toast(msg); }
  function recToggle() {
    if (REC.on) { recStop(); return; }
    if (!recSupported()) { toast(recHint()); return; }
    if (!$('[data-bind="f:text"]')) return;
    const r = new (SR())();
    r.lang = 'he-IL'; r.continuous = !IS_ANDROID; r.interimResults = true; r.maxAlternatives = 1;
    const begin = () => {
      const v = ($('[data-bind="f:text"]') || { value: '' }).value.trim();
      REC.base = v ? v + ' ' : ''; REC.audio = false; REC.t0 = Date.now();
      clearTimeout(REC.timer);
      REC.timer = setTimeout(() => { if (REC.on && !REC.audio) recStatus('המיקרופון לא מגיב. בדוק שאישרת גישה (המנעול ליד הכתובת) ושהמיקרופון במחשב לא מושתק.'); }, 6000);
      r.start();
    };
    REC.r = r; REC.on = true; REC.fails = 0;
    r.onaudiostart = () => { REC.audio = true; REC.fails = 0; clearTimeout(REC.timer); recStatus('מקשיב… דבר עכשיו'); };
    r.onspeechstart = () => recStatus('שומע דיבור…');
    r.onresult = e => { REC.audio = true; recSet(REC.base + recJoin(e.results)); };
    r.onerror = e => {
      const c = e && e.error;
      if (c === 'aborted') return;
      if (c === 'no-speech') { recStatus('לא נשמע דיבור. ממשיך להאזין…'); return; }
      if (c === 'not-allowed' || c === 'service-not-allowed') recFail(IS_BRAVE ? 'Brave חוסם זיהוי דיבור. נסה ב-Chrome או Safari.' : 'אין הרשאה למיקרופון או לזיהוי דיבור. אשר גישה בהגדרות האתר בדפדפן ובהגדרות הפרטיות של המערכת.');
      else if (c === 'audio-capture') recFail('לא נמצא מיקרופון. בדוק שהוא מחובר, נבחר במערכת ההפעלה ואינו מושתק.');
      else if (c === 'network') recFail(IS_BRAVE ? 'Brave חוסם את שירות הזיהוי. נסה ב-Chrome או Safari.' : 'אין חיבור לשירות זיהוי הדיבור של הדפדפן. בדוק חיבור לאינטרנט (בכרום השירות הוא של Google).');
      else if (c === 'language-not-supported') recFail('הדפדפן לא תומך בזיהוי עברית.');
      else recFail('ההקלטה נעצרה (' + (c || 'שגיאה') + ').');
    };
    r.onend = () => {
      if (REC.on) {
        if (!REC.audio && Date.now() - REC.t0 < 1500) REC.fails++;
        if (REC.fails >= 3) { recFail('ההקלטה לא מצליחה להתחיל במכשיר הזה. נסה Chrome, Edge או Safari מעודכנים, או הכתב דרך המקלדת.'); REC.r = null; return; }
        setTimeout(() => { if (!REC.on) return; try { begin(); } catch (err) { recFail('לא הצלחתי להפעיל את ההקלטה מחדש.'); } }, IS_ANDROID ? 120 : 0);
        return;
      }
      REC.r = null; recUI();
    };
    try { begin(); recUI(); recStatus('מתחבר למיקרופון…'); } catch (e) { REC.r = null; recFail('לא הצלחתי להתחיל הקלטה.'); }
  }

  /* ---------- photo grid helpers ---------- */
  const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  function docsHTML(f) {
    if (!(f.docs || []).length) return '<div class="ph-empty">עוד אין מסמכים.</div>';
    return f.docs.map(d => '<div class="doc"><span class="ic">' + icon('file', 20) + '</span><span class="dn">' + esc(d.name) + '<small>' + fmtSize(d.size) + '</small></span>' +
      '<button class="icon-btn" data-act="doc-del" data-id="' + d.id + '" aria-label="הסר מסמך">' + icon('x', 18) + '</button></div>').join('');
  }
  function updateDocs() { const el = $('#docs'); const f = curFinding(); if (el && f) el.innerHTML = docsHTML(f); }
  function addDocs(files) {
    const f = curFinding(); if (!f || !files.length) return;
    let n = 0;
    files.forEach(file => {
      if (file.size > 25 * 1048576) { toast('הקובץ ' + file.name + ' גדול מ-25MB ולא נוסף'); return; }
      f.docs.push({ id: uid(), name: file.name, type: file.type || 'application/octet-stream', size: file.size, blob: file }); n++;
    });
    if (n) { touch(); updateDocs(); toast(n === 1 ? 'המסמך נוסף' : n + ' מסמכים נוספו'); }
  }
  function updatePhotos() { const el = $('#photos'); const f = curFinding(); if (el && f) el.innerHTML = photosHTML(f); }
  async function addPhotos(files, openEditor) {
    const f = curFinding(); if (!f || !files.length) return;
    busy('מעבד תמונה…'); await tick();
    let n = 0;
    for (const file of files) {
      try {
        const im = await readFileImage(file, 1600, 0.82);
        f.photos.push({ id: uid(), orig: im.url, w: im.w, h: im.h, marks: [], flat: null, fw: 0, fh: 0, th: makeThumb(im.canvas, im.w, im.h) });
        n++;
      } catch (e) { console.error(e); }
    }
    busy(null); touch(); updatePhotos();
    if (n === 1 && openEditor) { skOpen(f.photos[f.photos.length - 1].id); return; }
    toast(n ? (n === 1 ? 'התמונה נוספה' : n + ' תמונות נוספו') : 'לא הצלחתי לקרוא את התמונה');
  }
  let pendingKind = null;
  async function setImage(kind, file) {
    if (!file) return;
    busy('מעבד תמונה…'); await tick();
    try {
      const url = URL.createObjectURL(file);
      const im = await loadImg(url), sig = kind === 'signature';
      const k = Math.min(1, (sig ? 500 : 2000) / im.naturalWidth), w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d');
      if (!sig) { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
      x.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const v = { src: sig ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86), w, h };
      if (sig) S.settings.signature = v; else S.settings[kind + 'Img'] = v;
      await DB.setMeta('settings', S.settings);
      busy(null); render();
    } catch (e) { busy(null); toast('לא הצלחתי לקרוא את התמונה'); }
  }

  /* ---------- signature pad ---------- */
  const SG = { cv: null, strokes: [], cur: null, color: '#111111' };
  function sgDraw() {
    const c = SG.cv, x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
    x.lineCap = 'round'; x.lineJoin = 'round';
    SG.strokes.forEach(st => {
      x.strokeStyle = st.c; x.lineWidth = 6; x.fillStyle = st.c; x.beginPath();
      if (st.p.length === 1) { x.arc(st.p[0][0], st.p[0][1], 3, 0, 7); x.fill(); return; }
      x.moveTo(st.p[0][0], st.p[0][1]);
      for (let i = 1; i < st.p.length - 1; i++) { const m = [(st.p[i][0] + st.p[i + 1][0]) / 2, (st.p[i][1] + st.p[i + 1][1]) / 2]; x.quadraticCurveTo(st.p[i][0], st.p[i][1], m[0], m[1]); }
      const l = st.p[st.p.length - 1]; x.lineTo(l[0], l[1]); x.stroke();
    });
    const un = $('#sg-undo'); if (un) un.disabled = !SG.strokes.length;
  }
  function sgOpen() {
    const el = document.createElement('div'); el.className = 'sk'; el.id = 'sg'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'ציור חתימה');
    el.innerHTML =
      '<div class="sk-top"><button class="btn" data-act="sg-cancel">ביטול</button><span>חתום באצבע</span><button class="btn primary" data-act="sg-save">שמור</button></div>' +
      '<div class="sk-stage"><canvas id="sg-cv" width="1400" height="600" aria-label="אזור חתימה" style="background:#fff;width:min(94vw,640px);aspect-ratio:7/3;border-radius:8px"></canvas></div>' +
      '<div class="sk-tools"><div class="sk-row">' +
      '<button class="sk-color" data-act="sg-color" data-color="#111111" style="background:#111111" aria-label="שחור" aria-pressed="true"></button>' +
      '<button class="sk-color" data-act="sg-color" data-color="#1E3FA8" style="background:#1E3FA8" aria-label="כחול" aria-pressed="false"></button>' +
      '<span class="sk-sep"></span>' +
      '<button class="sk-tool" id="sg-undo" data-act="sg-undo" aria-label="בטל קו אחרון" disabled>' + icon('undo', 24) + '</button>' +
      '<button class="sk-tool" data-act="sg-clear" aria-label="נקה" style="width:auto;padding:0 10px;font-size:13px;font-weight:700">נקה</button></div></div>';
    document.body.appendChild(el);
    SG.cv = $('#sg-cv'); SG.strokes = []; SG.cur = null; SG.color = '#111111'; sgDraw();
    const pt = e => { const r = SG.cv.getBoundingClientRect(); return [(e.clientX - r.left) * SG.cv.width / r.width, (e.clientY - r.top) * SG.cv.height / r.height]; };
    SG.cv.style.touchAction = 'none';
    SG.cv.addEventListener('pointerdown', e => { e.preventDefault(); try { SG.cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } SG.cur = { c: SG.color, p: [pt(e)] }; SG.strokes.push(SG.cur); sgDraw(); });
    SG.cv.addEventListener('pointermove', e => { if (!SG.cur) return; e.preventDefault(); SG.cur.p.push(pt(e)); sgDraw(); });
    const end = () => { SG.cur = null; };
    SG.cv.addEventListener('pointerup', end); SG.cv.addEventListener('pointercancel', end);
  }
  function sgClose() { const el = $('#sg'); if (el) el.remove(); SG.cv = null; SG.strokes = []; SG.cur = null; }
  async function sgSave() {
    if (!SG.strokes.length) { toast('צייר חתימה קודם'); return; }
    const c = SG.cv; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    SG.strokes.forEach(st => st.p.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }));
    const pad = 12; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(c.width, x1 + pad); y1 = Math.min(c.height, y1 + pad);
    const w = Math.max(1, Math.round(x1 - x0)), h = Math.max(1, Math.round(y1 - y0)), k = Math.min(1, 700 / w);
    const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(w * k)); o.height = Math.max(1, Math.round(h * k));
    o.getContext('2d').drawImage(c, x0, y0, w, h, 0, 0, o.width, o.height);
    S.settings.signature = { src: o.toDataURL('image/png'), w: o.width, h: o.height };
    await DB.setMeta('settings', S.settings);
    sgClose(); render(); toast('החתימה נשמרה');
  }

  /* ---------- events ---------- */
  function armed(btn, fn) {
    if (btn.dataset.armed) { clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; fn(); return; }
    const orig = btn.innerHTML;
    btn.innerHTML = esc(btn.dataset.arm || 'בטוח?');
    btn.dataset.armed = String(setTimeout(() => { btn.innerHTML = orig; delete btn.dataset.armed; }, 3000));
  }
  function bindValue(t) {
    const b = t.dataset.bind; if (!b) return;
    const parts = b.split(':'), v = t.type === 'checkbox' ? t.checked : t.value;
    if (parts[0] === 's') { S.settings[parts[1]] = v; DB.setMeta('settings', S.settings); return; }
    if (!S.report) return;
    if (parts[0] === 'r') S.report[parts[1]] = v;
    else if (parts[0] === 'a') { const a = S.report.attendees.find(x => x.id === parts[1]); if (a) a[parts[2]] = v; }
    else if (parts[0] === 'c') { const a = S.report.cc.find(x => x.id === parts[1]); if (a) a[parts[2]] = v; }
    else if (parts[0] === 'f') { const f = curFinding(); if (f) f[parts[1]] = v; }
    touch();
    if (parts[0] === 'r' && (parts[1] === 'project' || parts[1] === 'date')) {
      const h = $('.top h1'); if (h) { h.firstChild.textContent = S.report.project || 'דו״ח חדש'; const sub = $('.top h1 .sub'); if (sub) sub.textContent = fmtDate(S.report.date); }
    }
  }
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('textarea')) autosize(t);
    if (t.dataset && t.dataset.bind) bindValue(t);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'in-doc') { const files = Array.from(t.files || []); t.value = ''; addDocs(files); return; }
    if (t.id === 'in-cam' || t.id === 'in-gal') { const files = Array.from(t.files || []); const cam = t.id === 'in-cam'; t.value = ''; addPhotos(files, cam); }
    else if (t.id === 'in-img') { const f = t.files && t.files[0]; t.value = ''; setImage(pendingKind, f); }
    else if (t.dataset && t.dataset.bind) bindValue(t);
  });

  const ACT = {
    'settings': () => go('settings'),
    'sg-open': () => sgOpen(),
    'sg-cancel': () => sgClose(),
    'sg-save': () => sgSave(),
    'sg-undo': () => { SG.strokes.pop(); sgDraw(); },
    'sg-clear': () => { SG.strokes = []; sgDraw(); },
    'sg-color': (b) => { SG.color = b.dataset.color; $$('#sg [data-act=sg-color]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); },
    'first-done': async () => {
      if (!String(S.settings.supervisorName || '').trim()) { toast('נא להזין שם מלא'); return; }
      S.settings.supervisorName = S.settings.supervisorName.trim(); S.first = false;
      await DB.setMeta('settings', S.settings); go('list');
    },
    'back-list': async () => { await flush(); S.report = null; S.summaries = await DB.summaries(); go('list'); },
    'new': async () => { S.report = newReport(); S.tab = 'details'; dirty = true; await flush(); go('report', 'details'); },
    'open': async (b) => { busy('פותח דו״ח…'); const r = await DB.get(b.dataset.id); busy(null); if (!r) { toast('לא הצלחתי לפתוח את הדו״ח'); return; } S.report = normalizeReport(r); go('report', 'details'); setSaved('נשמר'); },
    'dup': async (b) => { const from = await DB.get(b.dataset.id); if (!from) return; S.report = newReport(normalizeReport(from)); dirty = true; await flush(); go('report', 'details'); toast('נוצר דו״ח המשך עם אותו נושא, מיקום ומשתתפים'); },
    'del': (b) => armed(b, async () => { await DB.del(b.dataset.id); S.summaries = S.summaries.filter(x => x.id !== b.dataset.id); render(); toast('הדו״ח נמחק'); }),
    'tab': (b) => { S.tab = b.dataset.tab; S.pvTok++; render(); window.scrollTo(0, 0); },
    'att-add': () => { const a = newAttendee(); S.report.attendees.push(a); touch(); $('#atts').insertAdjacentHTML('beforeend', attRow(a)); const i = $('#atts .att:last-child input'); if (i) i.focus(); },
    'cc-add': () => { const a = newAttendee(); S.report.cc.push(a); touch(); $('#ccs').insertAdjacentHTML('beforeend', ccRow(a)); const i = $('#ccs .att:last-child input'); if (i) i.focus(); },
    'cc-del': (b) => { S.report.cc = S.report.cc.filter(a => a.id !== b.dataset.id); touch(); b.closest('.att').remove(); },
    'att-del': (b) => { S.report.attendees = S.report.attendees.filter(a => a.id !== b.dataset.id); touch(); b.closest('.att').remove(); },
    'f-new': () => { const f = newFinding(); S.report.findings.push(f); S.fid = f.id; touch(); go('finding'); },
    'f-up': (b) => moveFinding(b.dataset.id, -1),
    'f-down': (b) => moveFinding(b.dataset.id, 1),
    'f-open': (b) => { S.fid = b.dataset.id; go('finding'); },
    'f-back': () => {
      const f = curFinding();
      if (f && !f.text && !f.photos.length) { S.report.findings = S.report.findings.filter(x => x !== f); touch(); }
      S.fid = null; go('report', 'findings');
    },
    'f-del': (b) => armed(b, () => { S.report.findings = S.report.findings.filter(x => x.id !== S.fid); S.fid = null; touch(); go('report', 'findings'); toast('ההערה נמחקה'); }),
    'doc-add': () => $('#in-doc').click(),
    'doc-del': (b) => { const f = curFinding(); if (f) { f.docs = f.docs.filter(d => d.id !== b.dataset.id); touch(); updateDocs(); } },
    'cam': () => $('#in-cam').click(),
    'gal': () => $('#in-gal').click(),
    'ph-del': (b) => { const f = curFinding(); f.photos = f.photos.filter(p => p.id !== b.dataset.pid); touch(); updatePhotos(); },
    'sk-open': (b) => skOpen(b.dataset.pid),
    'img-pick': (b) => { pendingKind = b.dataset.kind; $('#in-img').click(); },
    'img-del': async (b) => { const k = b.dataset.kind; if (k === 'signature') delete S.settings.signature; else S.settings[k + 'Img'] = false; await DB.setMeta('settings', S.settings); render(); },
    'img-reset': async (b) => { delete S.settings[b.dataset.kind + 'Img']; await DB.setMeta('settings', S.settings); render(); },
    'dl-docx': exportDocx,
    'dl-pdf': exportPdf,
    'send-mail': sendMail,
    'sk-cancel': () => skClose(),
    'sk-save': () => skSave(),
    'sk-tool': (b) => { SK.tool = b.dataset.tool; SK.tpos = null; skRedraw(); skUI(); },
    'sk-color': (b) => { SK.color = b.dataset.color; if (SK.sel >= 0 && SK.marks[SK.sel]) SK.marks[SK.sel].c = SK.color; skRedraw(); skUI(); },
    'sk-size': (b) => { SK.size = b.dataset.size; const m = SK.marks[SK.sel]; if (m && m.t === 'text') m.s = TS[SK.size]; skRedraw(); skUI(); },
    'sk-del': () => { if (SK.sel >= 0) { SK.marks.splice(SK.sel, 1); SK.sel = -1; SK.editIdx = -1; $('#sk-text').value = ''; skRedraw(); skUI(); } },
    'rec': () => recToggle(),
    'sk-undo': () => { SK.marks.pop(); SK.sel = -1; SK.editIdx = -1; skRedraw(); skUI(); },
    'sk-clear': (b) => armed(b, () => { SK.marks = []; skRedraw(); skUI(); }),
    'sk-text-ok': () => skTextOk()
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'sk-text') { e.preventDefault(); skTextOk(); }
  });

  /* ---------- init ---------- */
  async function init() {
    mountSketch();
    skBind();
    await DB.init();
    const st = await DB.getMeta('settings');
    S.settings = Object.assign({ officeName: 'קו בנוף', supervisorName: '', supervisorRole: 'אדריכל נוף', signTitle: '' }, st || {});
    S.summaries = await DB.summaries();
    if (!S.settings.supervisorName) { S.first = true; S.screen = 'settings'; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
    render();
    try {
      const c = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      S.dl = c || null;
      if (S.screen === 'report' && S.tab === 'export') render();
    } catch (e) { S.dl = null; }
  }
  init();
})();

</script>
